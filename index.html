<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MoviMoon Player</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:'Outfit',sans-serif;overflow:hidden}
#loader{position:fixed;inset:0;background:radial-gradient(ellipse at center,#0a0a0a 0%,#000000 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;gap:0}
.logo-wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:20px}
.logo-icon{width:70px;height:70px;background:linear-gradient(135deg,#00ff88,#00cc6a);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:32px;color:#000;animation:logoPulse 2s ease-in-out infinite;box-shadow:0 0 40px rgba(0,255,136,0.4)}
@keyframes logoPulse{0%,100%{transform:scale(1);box-shadow:0 0 40px rgba(0,255,136,0.4)}50%{transform:scale(1.05);box-shadow:0 0 60px rgba(0,255,136,0.7)}}
.loader-title{font-size:26px;font-weight:700;letter-spacing:1px;background:linear-gradient(90deg,#fff,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 2s linear infinite;background-size:200% auto}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
.dots{display:flex;gap:8px;margin-top:15px}
.dots span{width:8px;height:8px;background:#00ff88;border-radius:50%;animation:dotBounce 1.4s infinite ease-in-out both}
.dots span:nth-child(1){animation-delay:-0.32s}
.dots span:nth-child(2){animation-delay:-0.16s}
@keyframes dotBounce{0%,80%,100%{transform:scale(0);opacity:0.5}40%{transform:scale(1);opacity:1}}
#player-wrap{position:relative;width:100vw;height:100vh;background:#000}
#main-iframe{width:100%;height:100%;border:none;background:#000;transition:all 0.3s}
#main-iframe.fullsite-mode{height:180%;margin-top:-60px}
#server-box{position:absolute;top:12px;right:12px;z-index:20;display:flex;gap:8px;align-items:center;backdrop-filter:blur(10px)}
#server-select{background:rgba(15,15,15,0.9);border:1px solid rgba(0,255,136,0.3);color:#fff;padding:10px 14px;border-radius:10px;min-width:240px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:500;cursor:pointer;outline:none;transition:all 0.2s;box-shadow:0 4px 15px rgba(0,0,0,0.5)}
#server-select:hover{border-color:#00ff88;background:rgba(20,20,20,0.95)}
#server-select option{background:#111;color:#fff;padding:8px}
.badge{background:linear-gradient(135deg,#00ff88,#00cc6a);color:#000;padding:6px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.5px;box-shadow:0 2px 10px rgba(0,255,136,0.3)}
#top-bar{position:absolute;top:0;left:0;right:0;height:60px;background:linear-gradient(180deg,rgba(0,0,0,0.95) 0%,rgba(0,0,0,0) 100%);display:flex;align-items:center;padding:0 18px;z-index:10;pointer-events:none}
#top-bar i{color:#00ff88;font-size:18px}
#top-bar span{font-weight:700;letter-spacing:0.5px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
</style>
</head>
<body>
<div id="loader">
  <div class="logo-wrap">
    <div class="logo-icon"><i class="fa-solid fa-play"></i></div>
    <div class="loader-title">MoviMoon Server Loading</div>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
</div>
<div id="player-wrap">
  <div id="top-bar">
    <div style="display:flex;gap:10px;align-items:center">
      <i class="fa-solid fa-clapperboard"></i>
      <span>MoviMoon</span>
    </div>
  </div>
  <div id="server-box">
    <span class="badge" id="working-count"><i class="fa fa-circle" style="font-size:8px;animation:blink 1s infinite"></i> 0</span>
    <select id="server-select">
      <option>Loading servers...</option>
    </select>
  </div>
  <iframe id="main-iframe" allowfullscreen allow="autoplay; encrypted-media; fullscreen; picture-in-picture" referrerpolicy="no-referrer" sandbox="allow-forms allow-scripts allow-same-origin allow-presentation allow-popups"></iframe>
</div>
<script>
const BACKEND_URL = 'https://movimoon-backend.onrender.com';
const urlParams = new URLSearchParams(window.location.search);
const tmdb = urlParams.get('tmdb');
const type = urlParams.get('type')||'movie';
const season = urlParams.get('s')||'1';
const episode = urlParams.get('e')||'1';
async function init(){
 if(!tmdb){ document.querySelector('.loader-title').innerText='ID Missing'; return; }
 try{
  const apiUrl = `${BACKEND_URL}/api/resolve?tmdb=${tmdb}&type=${type}&s=${season}&e=${episode}`;
  const res = await fetch(apiUrl);
  const data = await res.json();
  const servers = data.availableServers || [];
  document.getElementById('working-count').innerHTML = `<i class="fa fa-circle" style="font-size:8px;animation:blink 1s infinite"></i> ${data.workingCount}`;
  const select = document.getElementById('server-select');
  select.innerHTML = '';
  servers.forEach((srv, idx)=>{
    const opt = document.createElement('option');
    opt.value = srv.embedUrl;
    opt.dataset.fullsite = srv.isFullSite ? '1' : '0';
    const shortName = srv.name.replace(' - Server','').replace(' COM','').replace(' - IMDB','').replace(' - Vidbox VC','').trim();
    opt.innerText = `${idx+1}. ${shortName}`;
    select.appendChild(opt);
  });
  if(data.defaultServer){
    playServer(data.defaultServer);
    select.value = data.defaultServer.embedUrl;
  }
  select.addEventListener('change', (e)=>{
    const srv = servers.find(s=>s.embedUrl===e.target.value);
    if(srv) playServer(srv);
  });
  const loader = document.getElementById('loader');
  loader.style.transition = 'opacity 0.5s';
  loader.style.opacity = '0';
  setTimeout(()=> loader.style.display='none', 500);
 }catch(err){
  console.error(err);
  document.querySelector('.loader-title').innerText = 'Loading Failed';
 }
}
function playServer(srv){
  const iframe = document.getElementById('main-iframe');
  if(srv.isFullSite){
    iframe.classList.add('fullsite-mode');
    iframe.src = srv.embedUrl;
  } else {
    iframe.classList.remove('fullsite-mode');
    iframe.src = srv.embedUrl;
  }
}
init();
</script>
</body>
</html>
